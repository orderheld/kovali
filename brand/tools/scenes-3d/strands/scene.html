  const toWorld = (nx, ny, d) => { const xv = (nx + P[8]) * d / P[0], yv = (ny + P[9]) * d / P[5]; return new THREE.Vector3(xv, yv, -d).applyMatrix4(heroCam.matrixWorld); };
  const NDUST = +(Q.get('ndust') || 0);
  for (let k = 0; k < NDUST; k++) {
    const q = toWorld(0.05 + pr() * 1.05, -1.0 + pr() * 2.0, 3.0 + pr() * 5.0);
    parts.push([q.x, q.y, q.z, 0.0012, 0.25 + pr() * 0.45, 0.5 + pr() * 0.5]);
  }
  for (let k = 0; k < NDUST * 2; k++) {
    const q = toWorld(-0.1 + pr() * 1.2, -1.0 + pr() * 2.0, 20 + pr() * 30);
    parts.push([q.x, q.y, q.z, 0.0007 + pr() * 0.0006, 0.2 + pr() * 0.5, 0.3 + pr() * 0.4]);
  }
}
const pGeo = new THREE.InstancedBufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,1,0]), 3));
pGeo.setIndex([0,1,2, 0,2,3]);
{
  const a = new Float32Array(parts.length * 3), b = new Float32Array(parts.length * 3);
  parts.forEach((q, i) => { a.set([q[0], q[1], q[2]], i * 3); b.set([q[3], q[4], q[5]], i * 3); });
  pGeo.setAttribute('iPos', new THREE.InstancedBufferAttribute(a, 3));
  pGeo.setAttribute('iDat', new THREE.InstancedBufferAttribute(b, 3));
  pGeo.instanceCount = parts.length;
}
const partMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ uGain: { value: 1.0 } }, common),
  vertexShader: /* glsl */`
    attribute vec3 iPos; attribute vec3 iDat;
    uniform vec2 uRes; uniform float uFocus, uAp, uGain;
    uniform vec3 uC1, uC2, uC3;
    varying vec2 vUv; varying vec3 vCol; varying float vR;
    void main(){
      vec4 vp = viewMatrix * vec4(iPos, 1.0);
      vec4 c = projectionMatrix * vp;
      float depth = -vp.z;
      float core = iDat.x * uRes.y;
      float coc = uAp * abs(1.0 - uFocus / depth);
      float r = core + coc;
      float pad = 1.0;
      c.xy += position.xy * (r + pad) / (uRes * 0.5) * c.w;
      gl_Position = c;
      vUv = position.xy * (r + pad) / r;
      vR = r;
      vec3 col = mix(uC2, uC3, smoothstep(0.5, 1.0, iDat.z));
      col = mix(col, vec3(1.0), 0.25);
      float fog = exp(-max(0.0, depth - 12.0) * 0.05);
      vCol = col * iDat.y * uGain * (core*core) / (r*r) * fog;
    }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv; varying vec3 vCol; varying float vR;
    void main(){
      float d = length(vUv);
      float disc = smoothstep(1.0, 1.0 - min(1.0, 1.5 / vR), d);
      float rim = 0.85 + 0.3 * smoothstep(0.55, 0.98, d);   // slight bright rim like real lens bokeh
      float core = exp(-d*d*3.0);
      float k = vR < 4.0 ? core * 2.2 : disc * rim;
      gl_FragColor = vec4(vCol * k, 1.0);
    }`,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  depthTest: false, depthWrite: false, transparent: true, side: THREE.DoubleSide,
});
const partMesh = new THREE.Mesh(pGeo, partMat);
partMesh.frustumCulled = false;

const scene = new THREE.Scene();
scene.add(fibreMesh);
scene.add(partMesh);

// ---------------------------------------------------------------------------
// Post: physically-based bloom (13-tap downsample / tent upsample) + composite
// ---------------------------------------------------------------------------
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const fsVert = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
function pass(frag, uniforms) {
  const m = new THREE.ShaderMaterial({ vertexShader: fsVert, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false });
  const mesh = new THREE.Mesh(quadGeo, m); mesh.frustumCulled = false;
  const sc = new THREE.Scene(); sc.add(mesh);
  return { m, run(target) { renderer.setRenderTarget(target); renderer.render(sc, quadCam); } };
}
const down = pass(/* glsl */`
  uniform sampler2D tSrc; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec2 t = uTexel;
    vec3 a = texture2D(tSrc, vUv + t*vec2(-2., 2.)).rgb, b = texture2D(tSrc, vUv + t*vec2(0., 2.)).rgb, c = texture2D(tSrc, vUv + t*vec2(2., 2.)).rgb;
    vec3 d = texture2D(tSrc, vUv + t*vec2(-2., 0.)).rgb, e = texture2D(tSrc, vUv).rgb, f = texture2D(tSrc, vUv + t*vec2(2., 0.)).rgb;
    vec3 g = texture2D(tSrc, vUv + t*vec2(-2.,-2.)).rgb, h = texture2D(tSrc, vUv + t*vec2(0.,-2.)).rgb, i = texture2D(tSrc, vUv + t*vec2(2.,-2.)).rgb;
    vec3 j = texture2D(tSrc, vUv + t*vec2(-1., 1.)).rgb, k = texture2D(tSrc, vUv + t*vec2(1., 1.)).rgb;
    vec3 l = texture2D(tSrc, vUv + t*vec2(-1.,-1.)).rgb, m = texture2D(tSrc, vUv + t*vec2(1.,-1.)).rgb;
    vec3 o = e*0.125 + (a+c+g+i)*0.03125 + (b+d+f+h)*0.0625 + (j+k+l+m)*0.125;
    gl_FragColor = vec4(o, 1.0);
  }`, { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() } });
const up = pass(/* glsl */`
  uniform sampler2D tSrc; uniform sampler2D tAdd; uniform vec2 uTexel; uniform float uMix; varying vec2 vUv;
  void main(){
    vec2 t = uTexel;
    vec3 s = texture2D(tSrc, vUv).rgb * 4.0;
    s += (texture2D(tSrc, vUv + t*vec2(-1.,0.)).rgb + texture2D(tSrc, vUv + t*vec2(1.,0.)).rgb + texture2D(tSrc, vUv + t*vec2(0.,-1.)).rgb + texture2D(tSrc, vUv + t*vec2(0.,1.)).rgb) * 2.0;
    s += texture2D(tSrc, vUv + t*vec2(-1.,-1.)).rgb + texture2D(tSrc, vUv + t*vec2(1.,-1.)).rgb + texture2D(tSrc, vUv + t*vec2(-1.,1.)).rgb + texture2D(tSrc, vUv + t*vec2(1.,1.)).rgb;
    s /= 16.0;
    gl_FragColor = vec4(mix(texture2D(tAdd, vUv).rgb, s, uMix), 1.0);
  }`, { tSrc: { value: null }, tAdd: { value: null }, uTexel: { value: new THREE.Vector2() }, uMix: { value: 0.6 } });

const LEVELS = 7;
const mips = [];
{ let w = W, h = H; for (let i = 0; i < LEVELS; i++) { w = Math.max(1, Math.floor(w / 2)); h = Math.max(1, Math.floor(h / 2)); mips.push(new THREE.WebGLRenderTarget(w, h, rtOpts)); } }
const ups = mips.map(m => new THREE.WebGLRenderTarget(m.width, m.height, rtOpts));

const comp = pass(/* glsl */`
  uniform sampler2D tScene, tBloom; uniform vec2 uRes; uniform float uExposure, uBloom, uTime, uHP, uBgK;
  uniform vec3 uInk, uNavy, uBlue, uElec; uniform vec2 uBgC, uHaze; uniform float uHazeK;
  varying vec2 vUv;
  vec3 RRTAndODTFit(vec3 v){ vec3 a = v*(v+0.0245786)-0.000090537; vec3 b = v*(0.983729*v+0.4329510)+0.238081; return a/b; }
  vec3 aces(vec3 c){
    const mat3 I = mat3(vec3(0.59719,0.07600,0.02840), vec3(0.35458,0.90834,0.13383), vec3(0.04823,0.01566,0.83777));
    const mat3 O = mat3(vec3(1.60475,-0.10208,-0.00327), vec3(-0.53108,1.10813,-0.07276), vec3(-0.07367,-0.00605,1.07602));
    c = I * (c / 0.6); c = RRTAndODTFit(c); c = O * c; return clamp(c, 0.0, 1.0);
  }
  vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4))-0.055, step(0.0031308, c)); }
  float hash(vec2 p){ p = fract(p*vec2(443.897, 441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
  void main(){
    vec3 hdr = texture2D(tScene, vUv).rgb + texture2D(tBloom, vUv).rgb * uBloom;
    // ACES filmic, blended with a hue-preserving variant (ACES curve on the max channel) so that
    // bright electric blues stay saturated and only the hottest threads roll off to white
    vec3 e = hdr * uExposure;
    vec3 cA = aces(e);
    float m = max(max(e.r, e.g), e.b);
    float mt = aces(vec3(m)).r;
    vec3 cH = e * (mt / max(m, 1e-5));
    cH = mix(cH, vec3(mt), smoothstep(0.75, 1.0, mt) * 0.45);
    vec3 c = mix(cA, cH, uHP);
    // background: brand ink with a soft navy volume behind the subject (kept dark on the left)
    vec2 a = vec2(uRes.x/uRes.y, 1.0);
    vec2 q = (vUv - uBgC) * a;
    float g1 = exp(-dot(q,q) * 1.6);
    float g2 = exp(-dot(q,q) * 6.0);
    vec2 qh = (vUv - uHaze) * a;
    float hz = exp(-dot(qh,qh) * 10.0) * 0.75 + exp(-dot(qh,qh) * 3.0) * 0.25;
    vec3 bg = uInk + uNavy * uBgK * g1 + uBlue * 0.010 * g2 + uElec * uHazeK * hz;
    float vig = smoothstep(1.25, 0.35, length((vUv - vec2(0.55, 0.5)) * a * 0.9));
    bg *= mix(0.75, 1.0, vig);
    c = bg + c * (1.0 - 0.0 * c);
    c *= mix(0.86, 1.0, vig);
    vec3 o = toSRGB(clamp(c, 0.0, 1.0));
    o += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
    gl_FragColor = vec4(o, 1.0);
  }`, {
  tScene: { value: sceneRT.texture }, tBloom: { value: null }, uRes: { value: new THREE.Vector2(W, H) },
  uExposure: { value: 1.0 }, uBloom: { value: 0.26 }, uTime: { value: 0 }, uBgK: { value: +(Q.get('bgk') || 0.38) }, uHP: { value: +(Q.get('hp') || 0.9) },
  uInk: { value: lin(HEX.ink) }, uNavy: { value: lin(HEX.navy) }, uBlue: { value: lin(HEX.blue) },
  uBgC: { value: new THREE.Vector2(V.bgc[0], V.bgc[1]) },
  uHaze: { value: new THREE.Vector2() }, uHazeK: { value: +(Q.get('haze') || 0.008) }, uElec: { value: lin(HEX.electric) },
});
{ const hp = common.uLc.value.clone().project(camera); comp.m.uniforms.uHaze.value.set(hp.x * 0.5 + 0.5, hp.y * 0.5 + 0.5); }
if (Q.has('exposure')) comp.m.uniforms.uExposure.value = +Q.get('exposure');
if (Q.has('bloom')) comp.m.uniforms.uBloom.value = +Q.get('bloom');
if (Q.has('gain')) fibreMat.uniforms.uGain.value = +Q.get('gain');

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
const t0 = performance.now();
renderer.setRenderTarget(sceneRT);
renderer.setClearColor(0x000000, 1);
renderer.clear();
renderer.render(scene, camera);

// bloom chain
let src = sceneRT;
for (let i = 0; i < LEVELS; i++) {
  down.m.uniforms.tSrc.value = src.texture;
  down.m.uniforms.uTexel.value.set(1 / src.width, 1 / src.height);
  down.run(mips[i]);
  src = mips[i];
}
let prev = mips[LEVELS - 1];
for (let i = LEVELS - 2; i >= 0; i--) {
  up.m.uniforms.tSrc.value = prev.texture;
  up.m.uniforms.tAdd.value = mips[i].texture;
  up.m.uniforms.uTexel.value.set(1 / prev.width, 1 / prev.height);
  up.m.uniforms.uMix.value = +(Q.get('bmix') || 0.56);
  up.run(ups[i]);
  prev = ups[i];
}
comp.m.uniforms.tBloom.value = ups[0].texture;
renderer.setRenderTarget(null);
renderer.clear();
comp.run(null);
const gl = renderer.getContext();
gl.finish();
console.log('render ms', Math.round(performance.now() - t0), 'verts', nV);
window.__done = true;
</script>
