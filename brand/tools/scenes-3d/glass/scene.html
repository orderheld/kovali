<title>layers - frosted glass panes</title>
<style>html,body{margin:0;background:#05070d;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<script type="module">
/*
  "Layers" — frosted glass panes stacked in depth.
  URL params:
    w, h        output canvas size in px (render at 2x and downscale for final)
    view        hero | detail | banner | cover
    dbg         optional debug mode (env | noDof)
    any number in P below can be overridden by query, e.g. &focus=8.2&cocK=0.05
  Pipeline (all linear HDR, half float):
    1. background (gradient + volumetric in-scatter from the light source)
    2. for every pane, back to front:
         a. blur pyramid of everything behind it
         b. render pane: frosted transmission (pyramid), polished refracting bevel,
            fresnel reflections of an analytic studio environment, back-scatter
            from the light, edge-lit glow
         c. per-layer depth of field (thin-lens CoC from the pane's plane),
            composited premultiplied over the accumulation buffer
    3. bloom (wide, subtle) + ACES filmic + grade + dither -> canvas
*/
import * as THREE from 'three';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

const Q = new URLSearchParams(location.search);
const W = parseInt(Q.get('w') || '1280');
const H = parseInt(Q.get('h') || '720');
const VIEW = Q.get('view') || 'hero';
const DBG = Q.get('dbg') || '';

// ---------------------------------------------------------------- parameters
const VIEWS = {
  //      target x/y on frame (lens shift), vertical fov, camera azimuth/elevation (deg), distance, look-at target
  hero:   { cx: 0.665, cy: 0.50, fov: 32, az: 42, el: 3, dist: 7.6, tx: 0.0, ty: 0.0, tz: -1.9, focusPane: 0 },
  banner: { cx: 0.700, cy: 0.50, fov: 30, az: 42, el: 3, dist: 9.6, tx: 0.0, ty: 0.0, tz: -1.9, focusPane: 0 },
  cover:  { cx: 0.620, cy: 0.50, fov: 32, az: 42, el: 3, dist: 7.8, tx: 0.0, ty: 0.0, tz: -1.9, focusPane: 0 },
  detail: { cx: 0.500, cy: 0.50, fov: 30, az: 42, el: 3, dist: 5.2, tx: 0.0, ty: 0.0, tz: -1.2, focusPane: 0 },
};
const V = Object.assign({}, VIEWS[VIEW] || VIEWS.hero);
const P = {
  exposure: 1.0,
  focusPane: V.focusPane,
  cocK: 0.060,          // CoC scale (fraction of frame height at |1-zf/z| = 1)
  frost: 0.016,         // frosted blur radius as fraction of frame height
  refract: 0.035,       // bevel refraction strength (fraction of height)
  bloom: 0.06,
  lightI: 8.0,
  fog: 0.0025,
  edge: 1.0,
  key: 1.0, sheen: 0.8, strip: 5.0, stripY: -0.12, border: 0.09,
  spot: 1.0, beam: 1.0, beamW: 0.004, beamHalo: 0.06, tailK: 400.0,
  lightH: 0.6, core: 0.0, fwd: 10.0, iso: 0.10, scatK: 0.45,
  np: 7, gap: 0.62, xs: 0.05, rise: 0.04, fan: 0.0, fan0: 0.0, tilt: 0.0,
};
for (const k of Object.keys(P)) if (Q.has(k)) P[k] = parseFloat(Q.get(k));
for (const k of Object.keys(V)) if (Q.has(k)) V[k] = parseFloat(Q.get(k));

const C = (hex) => new THREE.Color(hex); // linear (ColorManagement converts from sRGB)
const COL = {
  ink: C('#05070D'), navy: C('#0B1733'), logo: C('#1F7BEA'), electric: C('#35A9FF'), sky: C('#8FCBFF'), white: C('#FFFFFF'),
};

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.domElement.style.width = W + 'px';
renderer.domElement.style.height = H + 'px';
renderer.autoClear = false;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const RT = (w, h, depth = false, samples = 0) => new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
  samples, type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: depth, stencilBuffer: false, generateMipmaps: false, colorSpace: THREE.NoColorSpace,
});

const NLEV = 8;
const acc = RT(W, H);
const layer = RT(W, H, true, Q.has('msaa') ? parseInt(Q.get('msaa')) : 4);
const accPyr = [acc]; const layPyr = [layer];
for (let i = 1; i < NLEV; i++) {
  accPyr.push(RT(Math.ceil(W / 2 ** i), Math.ceil(H / 2 ** i)));
  layPyr.push(RT(Math.ceil(W / 2 ** i), Math.ceil(H / 2 ** i)));
}

// ---------------------------------------------------------------- camera
const target = new THREE.Vector3(V.tx, V.ty, V.tz);
const camera = new THREE.PerspectiveCamera(V.fov, W / H, 0.1, 200);
{
  const az = THREE.MathUtils.degToRad(V.az), el = THREE.MathUtils.degToRad(V.el);
  camera.position.set(
    target.x - Math.sin(az) * Math.cos(el) * V.dist,
    target.y + Math.sin(el) * V.dist,
    target.z + Math.cos(az) * Math.cos(el) * V.dist);
  camera.lookAt(target);
  // lens shift: put the target at (cx, cy) of the frame
  camera.setViewOffset(W, H, -(V.cx - 0.5) * W, (V.cy - 0.5) * H, W, H);
  camera.updateMatrixWorld(true);
  camera.updateProjectionMatrix();
}

// ---------------------------------------------------------------- panes
const PANE = { w: 1.50, h: 2.00, t: 0.055, rc: 0.10, rb: 0.020 };
function paneGeometry() {
  const cw = PANE.w / 2 - PANE.rb, ch = PANE.h / 2 - PANE.rb, r = PANE.rc - PANE.rb;
  const s = new THREE.Shape();
  s.moveTo(-cw + r, -ch);
  s.lineTo(cw - r, -ch); s.absarc(cw - r, -ch + r, r, -Math.PI / 2, 0, false);
  s.lineTo(cw, ch - r);  s.absarc(cw - r, ch - r, r, 0, Math.PI / 2, false);
  s.lineTo(-cw + r, ch); s.absarc(-cw + r, ch - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-cw, -ch + r); s.absarc(-cw + r, -ch + r, r, Math.PI, Math.PI * 1.5, false);
  const depth = PANE.t - 2 * PANE.rb;
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: PANE.rb, bevelSize: PANE.rb, bevelSegments: 10, curveSegments: 24 });
  g.translate(0, 0, -depth / 2);
  return g;
}
const geo = paneGeometry();

// layout: cards stand upright, parallel, receding along -z (pane normal +z)
const NP = Math.round(P.np);
const panes = [];
for (let i = 0; i < NP; i++) {
  const k = i / (NP - 1);
  const pos = new THREE.Vector3(P.xs * i, P.rise * i + 0.03 * Math.sin(i * 1.7), -P.gap * i);
  const rot = new THREE.Euler(THREE.MathUtils.degToRad(P.tilt), THREE.MathUtils.degToRad(P.fan0 + P.fan * i), 0.0);
  panes.push({ i, pos, rot });
}
// light source sits behind the stack
const LIGHT = new THREE.Vector3(...(Q.get('light') || '0.9,0.5,-5.6').split(',').map(Number));
// traceability beam: from the light, through the stack, toward front-left
const BEAM_A = new THREE.Vector3(...(Q.get('beamA') || LIGHT.toArray().join(',')).split(',').map(Number));
const BEAM_B = new THREE.Vector3(...(Q.get('beamB') || '-0.5,-0.35,1.2').split(',').map(Number));

// ---------------------------------------------------------------- GLSL helpers
const FS_VERT = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

function pyrGLSL(prefix, n, name) {
  let s = '';
  for (let i = 0; i < n; i++) s += `uniform sampler2D ${prefix}${i};\n`;
  s += `vec4 ${name}Bil(int i, vec2 uv){\n`;
  for (let i = 0; i < n; i++) s += `  if(i==${i}) return texture2D(${prefix}${i}, uv);\n`;
  s += `  return vec4(0.0);\n}\n`;
  s += `vec4 ${name}Cub(int i, vec2 uv){\n`;
  for (let i = 0; i < n; i++) s += `  if(i==${i}) return bicubic(${prefix}${i}, uv);\n`;
  s += `  return vec4(0.0);\n}\n`;
  s += `vec4 ${name}Lvl(vec2 uv, float l){ l = clamp(l, 0.0, ${n - 1}.0); int i = int(floor(l)); float f = l - float(i);
    vec4 a = ${name}Cub(i, uv); if (f < 0.001) return a; return mix(a, ${name}Cub(min(i+1, ${n - 1}), uv), f); }\n`;
  s += `vec4 ${name}LvlFast(vec2 uv, float l){ l = clamp(l, 0.0, ${n - 1}.0); int i = int(floor(l)); float f = l - float(i);
    vec4 a = ${name}Bil(i, uv); if (f < 0.001) return a; return mix(a, ${name}Bil(min(i+1, ${n - 1}), uv), f); }\n`;
  return s;
}
const BICUBIC = /* glsl */`
vec4 bicubic(sampler2D tex, vec2 uv){
  vec2 ts = vec2(textureSize(tex, 0));
  vec2 st = uv * ts - 0.5; vec2 iuv = floor(st); vec2 f = fract(st);
  vec2 w0 = (1.0/6.0)*(f*(f*(-f + 3.0) - 3.0) + 1.0);
  vec2 w1 = (1.0/6.0)*(f*f*(3.0*f - 6.0) + 4.0);
  vec2 w2 = (1.0/6.0)*(f*(f*(-3.0*f + 3.0) + 3.0) + 1.0);
  vec2 w3 = (1.0/6.0)*(f*f*f);
  vec2 g0 = w0 + w1, g1 = w2 + w3;
  vec2 h0 = -1.0 + w1 / g0, h1 = 1.0 + w3 / g1;
  vec2 p0 = (iuv + h0 + 0.5) / ts, p1 = (iuv + h1 + 0.5) / ts;
  return g0.y * (g0.x * texture2D(tex, vec2(p0.x, p0.y)) + g1.x * texture2D(tex, vec2(p1.x, p0.y))) +
         g1.y * (g0.x * texture2D(tex, vec2(p0.x, p1.y)) + g1.x * texture2D(tex, vec2(p1.x, p1.y)));
}`;

const fsq = new FullScreenQuad();
function runPass(mat, target) { fsq.material = mat; renderer.setRenderTarget(target); fsq.render(renderer); }

// 13-tap downsample (Jimenez 2014)
const downMat = new THREE.ShaderMaterial({
  uniforms: { src: { value: null }, texel: { value: new THREE.Vector2() } },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    uniform sampler2D src; uniform vec2 texel; varying vec2 vUv;
    vec4 s(float x, float y){ return texture2D(src, vUv + texel * vec2(x, y)); }
    void main(){
      vec4 A=s(-2.,-2.),B=s(0.,-2.),Cc=s(2.,-2.),D=s(-1.,-1.),E=s(1.,-1.),F=s(-2.,0.),G=s(0.,0.),Hh=s(2.,0.),I=s(-1.,1.),J=s(1.,1.),K=s(-2.,2.),L=s(0.,2.),M=s(2.,2.);
      gl_FragColor = (D+E+I+J)*0.125 + (A+B+G+F)*0.03125 + (B+Cc+Hh+G)*0.03125 + (F+G+L+K)*0.03125 + (G+Hh+M+L)*0.03125;
    }`,
  depthTest: false, depthWrite: false,
});
function buildPyramid(pyr) {
  for (let i = 1; i < pyr.length; i++) {
    downMat.uniforms.src.value = pyr[i - 1].texture;
    downMat.uniforms.texel.value.set(1 / pyr[i - 1].width, 1 / pyr[i - 1].height);
    runPass(downMat, pyr[i]);
  }
}

const ENV_GLSL = /* glsl */`
uniform vec3 cInk, cNavy, cLogo, cElectric, cSky;
uniform float uKey, uSheen, uStrip, uStripY;
float softbox(vec3 R, vec3 c, vec3 upHint, vec2 hs, float soft){
  float d = dot(R, c); if (d <= 0.0) return 0.0;
  vec3 u = normalize(cross(upHint, c)); vec3 v = cross(c, u);
  vec2 p = vec2(dot(R, u), dot(R, v)) / d;
  vec2 q = smoothstep(hs + soft, hs - soft, abs(p));
  return q.x * q.y;
}
// box in (azimuth around +y from +z toward +x, elevation) degrees, soft edges
float angBox(vec3 R, float p0, float p1, float t0, float t1, float sp, float st){
  float ph = degrees(atan(R.x, R.z)); float th = degrees(asin(clamp(R.y, -1.0, 1.0)));
  float a = smoothstep(p0 - sp, p0 + sp, ph) * smoothstep(p1 + sp, p1 - sp, ph);
  float b = smoothstep(t0 - st, t0 + st, th) * smoothstep(t1 + st, t1 - st, th);
  return a * b;
}
// analytic studio environment, world space, linear radiance
vec3 envRad(vec3 R, float rough){
  float s = 0.03 + rough * 0.9;
  vec3 col = mix(cInk * 0.4, cNavy * 0.35, smoothstep(-0.3, 0.9, R.y));
  // key softbox right of the set, seen by the pane faces as a soft diagonal sheen
  col += angBox(R, 62.0, 115.0, -6.0, 45.0, 14.0, 12.0) * mix(cSky, vec3(1.0), 0.45) * 4.0 * uKey;
  // long thin strip light, tilted: a clean diagonal glint across the faces
  col += softbox(R, normalize(vec3(0.78, uStripY, 0.62)), normalize(vec3(0.45, 1.0, -0.2)), vec2(0.010, 0.9), 0.012 + rough * 0.3) * mix(cSky, vec3(1.0), 0.6) * uStrip;
  // broad dim overhead sheen: gives every face a soft top-to-bottom gradient
  col += angBox(R, 25.0, 100.0, -4.0, 60.0, 22.0, 20.0) * mix(cLogo, cSky, 0.6) * uSheen;
  // narrow electric strip lights behind the stack (dark-field edge lighting)
  col += softbox(R, normalize(vec3(0.85, 0.20, -0.48)), vec3(0,1,0), vec2(0.04, 0.80), s * 0.7) * cElectric * 7.0;
  col += softbox(R, normalize(vec3(-0.30, 0.25, -0.92)), vec3(0,1,0), vec2(0.05, 0.70), s * 0.7) * mix(cLogo, cElectric, 0.5) * 5.0;
  // top strip for the upper rims
  col += softbox(R, normalize(vec3(0.10, 0.97, -0.20)), vec3(0,0,-1), vec2(0.9, 0.06), s) * cSky * 2.0;
  return col;
}`;

// ---------------------------------------------------------------- background
const bgMat = new THREE.ShaderMaterial({
  uniforms: {
    uProjInv: { value: new THREE.Matrix4() }, uCamWorld: { value: new THREE.Matrix4() }, uCamPos: { value: new THREE.Vector3() },
    uLight: { value: LIGHT }, uLightI: { value: P.lightI }, uFog: { value: P.fog }, uLightH: { value: P.lightH }, uCore: { value: P.core },
    cInk: { value: COL.ink }, cNavy: { value: COL.navy }, cLogo: { value: COL.logo }, cElectric: { value: COL.electric }, cSky: { value: COL.sky },
  },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    uniform mat4 uProjInv, uCamWorld; uniform vec3 uCamPos, uLight; uniform float uLightI, uFog, uLightH, uCore;
    uniform vec3 cInk, cNavy, cLogo, cElectric, cSky;
    varying vec2 vUv;
    void main(){
      vec4 pv = uProjInv * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
      vec3 D = normalize((uCamWorld * vec4(normalize(pv.xyz / pv.w), 0.0)).xyz);
      vec3 O = uCamPos;
      // single scattering from a vertical line light in homogeneous haze (closed form per sample)
      vec3 glow = vec3(0.0); float core = 0.0;
      for (int k = 0; k < 9; k++) {
        vec3 Lp = uLight + vec3(0.0, (float(k) / 8.0 - 0.5) * 2.0 * uLightH, 0.0);
        vec3 m = O - Lp; float b = dot(D, m); float c = dot(m, m);
        float h = sqrt(max(c - b * b, 0.03));   // floor: no point-like spikes from the line samples
        float I = (atan((80.0 + b) / h) - atan(b / h)) / h;
        vec3 Ld = normalize(Lp - O);
        float ph = 0.6 + 0.8 * pow(max(dot(D, Ld), 0.0), 6.0);
        glow += mix(cLogo, cElectric, 0.6) * I * ph / 9.0;
        core += exp(-h * 3.0) * step(0.0, -b) / 9.0;
      }
      glow *= uLightI * uFog;
      glow += mix(cElectric, cSky, 0.6) * core * uLightI * uCore;
      // ambient void: ink at left, faint navy to the right
      vec3 base = mix(cInk, cNavy, 0.35 * smoothstep(0.0, 1.0, vUv.x) * (0.6 + 0.4 * vUv.y));
      gl_FragColor = vec4(base * 0.55 + glow, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

// ---------------------------------------------------------------- pane material
const paneMat = new THREE.ShaderMaterial({
  uniforms: {
    uRes: { value: new THREE.Vector2(W, H) },
    uRot: { value: new THREE.Matrix3() },
    uHalf: { value: new THREE.Vector3(PANE.w / 2, PANE.h / 2, PANE.t / 2) },
    uRc: { value: PANE.rc }, uRb: { value: PANE.rb },
    uFrostLvl: { value: 3.0 }, uRefract: { value: P.refract },
    uLight: { value: LIGHT }, uLightI: { value: P.lightI }, uAtten: { value: 1.0 }, uLightH: { value: P.lightH }, uFwd: { value: P.fwd }, uIso: { value: P.iso }, uScatK: { value: P.scatK }, uBorder: { value: P.border },
    uKey: { value: P.key }, uSheen: { value: P.sheen }, uStrip: { value: P.strip }, uStripY: { value: P.stripY }, uDbg: { value: ({ env: 1, refl: 2, trans: 3, emit: 4 })[DBG] || 0 }, uEdge: { value: 1.0 }, uSpot: { value: new THREE.Vector3() }, uSpotI: { value: 0.0 }, uIndex: { value: 0 },
    cInk: { value: COL.ink }, cNavy: { value: COL.navy }, cLogo: { value: COL.logo }, cElectric: { value: COL.electric }, cSky: { value: COL.sky },
    ...Object.fromEntries(accPyr.map((r, i) => ['A' + i, { value: r.texture }])),
  },
  vertexShader: /* glsl */`
    varying vec3 vWorld; varying vec3 vLocal;
    void main(){
      vLocal = position;
      vec4 wp = modelMatrix * vec4(position, 1.0); vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    ${BICUBIC}
    ${pyrGLSL('A', NLEV, 'acc')}
    ${ENV_GLSL}
    uniform vec2 uRes; uniform mat3 uRot; uniform vec3 uHalf; uniform float uRc, uRb;
    uniform int uDbg;
    uniform float uFrostLvl, uRefract, uLightI, uAtten, uEdge, uSpotI, uIndex;
    uniform vec3 uLight, uSpot; uniform float uLightH, uFwd, uIso, uScatK, uBorder;
    varying vec3 vWorld; varying vec3 vLocal;

    // signed distance to rounded-rect outline in the pane plane (negative inside)
    float rrect(vec2 p, vec2 hs, float r){ vec2 q = abs(p) - hs + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

    // analytic normal of the rounded slab (Minkowski sum of thin core and sphere rb)
    vec3 slabNormal(vec3 p){
      vec2 hs = uHalf.xy - uRb; float r = uRc - uRb; float tz = uHalf.z - uRb;
      vec2 q = abs(p.xy); vec2 c = hs - r; vec2 d = q - c; vec2 cp;
      if (d.x > 0.0 && d.y > 0.0) { float l = length(d); cp = c + d * min(l, r) / max(l, 1e-6); }
      else cp = min(q, hs);
      cp *= sign(p.xy);
      vec3 n = p - vec3(cp, clamp(p.z, -tz, tz));
      return normalize(n + vec3(0.0, 0.0, 1e-6 * sign(p.z)));
    }

    void main(){
      vec3 nL = slabNormal(vLocal);
      vec3 N = normalize(uRot * nL);
      vec3 Vw = normalize(cameraPosition - vWorld);
      vec3 faceN = normalize(uRot * vec3(0.0, 0.0, 1.0));
      if (dot(faceN, Vw) < 0.0) faceN = -faceN;
      float NdV = clamp(dot(N, Vw), 0.0, 1.0);
      float FdV = clamp(dot(faceN, Vw), 0.05, 1.0);
      float edgeT = 1.0 - abs(nL.z);                       // 0 on the faces, 1 on the side walls
      float sd = rrect(vLocal.xy, uHalf.xy, uRc);          // <0 inside, 0 at silhouette
      float distIn = -sd;                                  // distance from rim, world units

      // fresnel (glass ior 1.5)
      // (grazing angle limited: the outermost silhouette pixel otherwise flickers along raster steps)
      float F = 0.04 + 0.96 * pow(1.0 - max(NdV, 0.16), 5.0);

      // --- transmission: frosted faces, polished (clear, refracting) bevel
      vec2 suv = gl_FragCoord.xy / uRes;
      vec3 nV = (viewMatrix * vec4(N, 0.0)).xyz, fV = (viewMatrix * vec4(faceN, 0.0)).xyz;
      float graze = smoothstep(0.02, 0.30, NdV);           // calm the very silhouette (sub-pixel unstable)
      vec2 bend = (nV.xy - fV.xy) * uRefract * vec2(uRes.y / uRes.x, 1.0) * graze;
      float bevel = smoothstep(0.02, 0.35, edgeT);
      float frostMask = smoothstep(uBorder * 0.55, uBorder, distIn);   // polished clear margin, frosted field inside
      float lvl = mix(mix(0.9, uFrostLvl, frostMask), 0.6, bevel);
      vec3 trans;
      if (bevel > 0.01) {
        // dispersion along the refracting bevel (screen-space, what is directly behind)
        trans.r = accLvl(suv - bend * 1.06, lvl).r;
        trans.g = accLvl(suv - bend * 1.00, lvl).g;
        trans.b = accLvl(suv - bend * 0.93, lvl).b;
        // strongly deflected rays pick up the off-axis studio lights (dark-field edge glow)
        vec3 Td = normalize(-Vw - (N - faceN) * 1.35);
        trans = mix(trans, envRad(Td, 0.05), smoothstep(0.15, 0.8, edgeT) * 0.85 * graze);
      } else {
        trans = accLvl(suv, lvl).rgb;
      }
      // absorption: longer path at grazing angles -> deeper blue
      float path = 1.0 / FdV;
      vec3 absorb = exp(-vec3(1.10, 0.55, 0.22) * 0.35 * path);
      trans *= absorb * (1.0 - F);

      // --- reflection of the studio environment
      vec3 R = reflect(-Vw, N);
      vec3 refl = envRad(R, mix(0.10, 0.03, bevel)) * F;

      // --- back-scatter of the light source in the frosted volume
      vec3 scat = vec3(0.0);
      for (int k = 0; k < 9; k++) {
        vec3 Lp = uLight + vec3(0.0, (float(k) / 8.0 - 0.5) * 2.0 * uLightH, 0.0);
        vec3 Ld = normalize(vWorld - Lp);              // light travel direction
        float dL = length(vWorld - Lp);
        float inc = abs(dot(Ld, faceN));
        float fwd = pow(max(dot(Ld, Vw), 0.0), uFwd);
        scat += vec3(inc * (uIso + 1.6 * fwd) / (dL * dL));
      }
      scat *= mix(cLogo, cElectric, 0.55) * uLightI * uAtten * uScatK / 9.0;

      // --- traceability beam: diffuse hot spot where the beam pierces the pane
      float rs = length(vLocal.xy - uSpot.xy);
      vec3 spot = (mix(cSky, vec3(1.0), 0.5) * exp(-rs * rs / 0.0004) * 6.0
                 + mix(cElectric, cSky, 0.5) * exp(-rs * rs / 0.006) * 1.2
                 + mix(cLogo, cElectric, 0.5) * exp(-rs / 0.22) * 0.45
                 + cLogo * exp(-rs / 0.6) * 0.10) * uSpotI;

      // --- edge-lit glow (light piped through the sheet exits at the rim), brightest near where light enters
      float zn = clamp(vLocal.z / uHalf.z, -1.0, 1.0);
      float across = 0.55 + 0.45 * pow(abs(zn), 3.0);                  // two bright lines along the bevels
      float nearSpot = exp(-length(vLocal.xy - uSpot.xy) / 0.85);
      float pipe = uEdge * (0.55 + 0.45 * nearSpot) + uSpotI * nearSpot * 0.9;
      float rimFace = exp(-distIn / 0.03) * (1.0 - bevel);
      vec3 edgeCol = mix(cElectric, cSky, 0.25 + 0.35 * nearSpot);
      vec3 edge = edgeCol * pipe * (smoothstep(0.35, 0.95, edgeT) * 1.5 * across + rimFace * 0.20);
      vec3 col = trans + refl + scat * (1.0 - bevel * 0.5) + spot * (1.0 - bevel) + edge;
      col = col / (1.0 + max(max(col.r, col.g), col.b) / 24.0);
      if (uDbg == 1) col = envRad(R, 0.08) * 0.3;
      if (uDbg == 2) col = refl;
      if (uDbg == 3) col = trans;
      if (uDbg == 4) col = scat + edge + spot;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: true, depthWrite: true, side: THREE.FrontSide,
});

const paneScene = new THREE.Scene();
const paneMeshes = panes.map((p) => {
  const m = new THREE.Mesh(geo, paneMat);
  m.position.copy(p.pos); m.rotation.copy(p.rot); m.updateMatrixWorld(true);
  m.visible = false; paneScene.add(m); p.mesh = m; return m;
});


// ---------------------------------------------------------------- traceability beam (analytic line light with DOF)
const beamMat = new THREE.ShaderMaterial({
  uniforms: {
    uProjInv: { value: new THREE.Matrix4() }, uCamWorld: { value: new THREE.Matrix4() }, uViewM: { value: new THREE.Matrix4() },
    uCamPos: { value: new THREE.Vector3() }, uRes: { value: new THREE.Vector2(W, H) }, uTanHalf: { value: 0.3 },
    uA: { value: BEAM_A }, uB: { value: BEAM_B }, uT0: { value: 0 }, uT1: { value: 1 },
    uFocus: { value: 10 }, uCocK: { value: P.cocK }, uTail: { value: 2.0 }, uTailK: { value: P.tailK }, uW: { value: P.beamW }, uI: { value: P.beam }, uHalo: { value: P.beamHalo },
    cLogo: { value: COL.logo }, cElectric: { value: COL.electric }, cSky: { value: COL.sky },
  },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    uniform mat4 uProjInv, uCamWorld, uViewM; uniform vec3 uCamPos, uA, uB; uniform vec2 uRes;
    uniform float uTanHalf, uT0, uT1, uFocus, uCocK, uW, uI, uHalo, uTail, uTailK;
    uniform vec3 cLogo, cElectric, cSky;
    varying vec2 vUv;
    void main(){
      vec4 pv = uProjInv * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
      vec3 D = normalize((uCamWorld * vec4(normalize(pv.xyz / pv.w), 0.0)).xyz);
      vec3 O = uCamPos; vec3 v = uB - uA; vec3 w0 = O - uA;
      float a = 1.0, b = dot(D, v), c = dot(v, v), d = dot(D, w0), e = dot(v, w0);
      float den = max(a * c - b * b, 1e-6);
      float t = clamp((a * e - b * d) / den, uT0, uT1);
      vec3 P = uA + v * t;
      float sRay = max(dot(P - O, D), 0.01);
      float dist = length(O + D * sRay - P);
      float z = -(uViewM * vec4(P, 1.0)).z;
      float pxPerUnit = uRes.y / (2.0 * z * uTanHalf);
      float dpx = dist * pxPerUnit;
      float coc = uCocK * abs(1.0 - uFocus / max(z, 0.1)) * uRes.y;
      float wpx = uW * pxPerUnit;
      float sig = sqrt(wpx * wpx + 0.18 * coc * coc + 0.35);
      float core = exp(-dpx * dpx / (2.0 * sig * sig)) * (wpx + 0.6) / sig;
      float hs = uHalo * pxPerUnit + 0.5 * coc;
      float halo = exp(-dpx / max(hs, 1.0)) * 0.10 + exp(-dpx / max(hs * 4.0, 1.0)) * 0.025;
      // beam gets slightly dimmer as it travels toward the viewer (scattered by each layer)
      float along = mix(1.0, 0.55, t) * exp(-max(t - uTail, 0.0) * uTailK);
      vec3 col = (mix(cElectric, vec3(1.0), 0.45) * core * 6.0 + mix(cLogo, cElectric, 0.7) * halo * 3.0) * uI * along;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
});
let tailT = 2.0;
function drawBeam(t0, t1, focusZ) {
  if (P.beam <= 0 || t1 <= t0) return;
  const u = beamMat.uniforms;
  u.uProjInv.value.copy(camera.projectionMatrixInverse); u.uCamWorld.value.copy(camera.matrixWorld);
  u.uViewM.value.copy(camera.matrixWorldInverse); u.uCamPos.value.copy(camera.position);
  u.uTanHalf.value = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / camera.zoom;
  u.uT0.value = t0; u.uT1.value = t1; u.uTail.value = tailT; u.uTailK.value = P.tailK; u.uFocus.value = focusZ; u.uCocK.value = DBG === 'noDof' ? 0 : P.cocK;
  runPass(beamMat, acc);
}

// ---------------------------------------------------------------- DOF + composite
const dofMat = new THREE.ShaderMaterial({
  uniforms: {
    uProjInv: { value: new THREE.Matrix4() }, uPlane: { value: new THREE.Vector4() }, uRes: { value: new THREE.Vector2(W, H) },
    uFocus: { value: 10 }, uCocK: { value: P.cocK }, uLvlBias: { value: Q.has('lvlBias') ? parseFloat(Q.get('lvlBias')) : 0.0 },
    ...Object.fromEntries(layPyr.map((r, i) => ['L' + i, { value: r.texture }])),
  },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    ${BICUBIC}
    ${pyrGLSL('L', NLEV, 'lay')}
    uniform mat4 uProjInv; uniform vec4 uPlane; uniform vec2 uRes; uniform float uFocus, uCocK, uLvlBias;
    varying vec2 vUv;
    void main(){
      vec4 pv = uProjInv * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
      vec3 dir = normalize(pv.xyz / pv.w);
      float den = dot(uPlane.xyz, dir);
      float t = -uPlane.w / (abs(den) < 1e-5 ? 1e-5 : den);
      float z = t > 0.0 ? -(t * dir).z : 1000.0;
      float coc = uCocK * abs(1.0 - uFocus / max(z, 0.1));
      float r = coc * uRes.y;
      if (uLvlBias < -50.0) { gl_FragColor = vec4(vec3(r / 32.0), 1.0); return; }
      if (r < 0.7) { gl_FragColor = texture2D(L0, vUv); return; }
      const int NS = 128;
      float spacing = r * sqrt(3.14159 / float(NS));
      float lvl = clamp(log2(max(spacing * 1.1, 1.0)) - 0.35 + uLvlBias, 0.0, ${NLEV - 1}.0);
      vec3 p3 = fract(vec3(gl_FragCoord.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); float rot = 6.2831853 * fract((p3.x + p3.y) * p3.z);
      vec4 s = vec4(0.0); float ws = 0.0;
      for (int i = 0; i < NS; i++) {
        float fi = float(i) + 0.5;
        float rr = sqrt(fi / float(NS));
        float th = fi * 2.39996323 + rot;
        vec2 o = rr * vec2(cos(th), sin(th)) * r / uRes;
        float w = 1.0 + 0.25 * rr * rr;   // slightly brighter bokeh rim
        s += layLvlFast(vUv + o, lvl) * w; ws += w;
      }
      gl_FragColor = s / ws;
    }`,
  depthTest: false, depthWrite: false,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
});

// ---------------------------------------------------------------- final
const finalMat = new THREE.ShaderMaterial({
  uniforms: {
    uExposure: { value: P.exposure }, uBloom: { value: P.bloom }, uRes: { value: new THREE.Vector2(W, H) },
    cInk: { value: COL.ink }, cNavy: { value: COL.navy },
    ...Object.fromEntries(accPyr.map((r, i) => ['A' + i, { value: r.texture }])),
  },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    ${BICUBIC}
    ${pyrGLSL('A', NLEV, 'acc')}
    uniform float uExposure, uBloom; uniform vec2 uRes; uniform vec3 cInk, cNavy;
    varying vec2 vUv;
    vec3 RRTAndODTFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }
    vec3 aces(vec3 color){
      const mat3 ACESInputMat = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
      const mat3 ACESOutputMat = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
      color = ACESInputMat * color; color = RRTAndODTFit(color); color = ACESOutputMat * color; return clamp(color, 0.0, 1.0);
    }
    vec3 srgb(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec3 c = texture2D(A0, vUv).rgb;
      vec3 bl = accCub(2, vUv).rgb * 0.30 + accCub(3, vUv).rgb * 0.25 + accCub(4, vUv).rgb * 0.22 + accCub(5, vUv).rgb * 0.15 + accCub(6, vUv).rgb * 0.08;
      c = mix(c, bl, uBloom);
      // vignette (gentle, keeps the left calm)
      vec2 q = vUv - vec2(0.62, 0.5); q.x *= uRes.x / uRes.y;
      c *= mix(1.0, 0.78, smoothstep(0.35, 1.25, length(q)));
      c *= uExposure * 1.6;
      // shadow lift toward navy so the blacks are never dead
      c += cNavy * 0.006;
      vec3 o = srgb(aces(c));
      vec3 inkS = vec3(5.0, 7.0, 13.0) / 255.0;
      o = inkS + (1.0 - inkS) * o;
      // triangular dither before 8-bit quantisation
      float n = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.17) - 1.0;
      o += n / 255.0;
      if (uExposure > 99.0) o = texture2D(A0, vUv).rgb;
      gl_FragColor = vec4(o, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

// ---------------------------------------------------------------- render
function planeInView(mesh) {
  const n = new THREE.Vector3(0, 0, 1).applyQuaternion(mesh.quaternion).transformDirection(camera.matrixWorldInverse);
  const p = mesh.position.clone().applyMatrix4(camera.matrixWorldInverse);
  return new THREE.Vector4(n.x, n.y, n.z, -n.dot(p));
}
function screenBox(mesh, pad) {
  const b = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let k = 0; k < 8; k++) {
    const v = new THREE.Vector3(k & 1 ? b.max.x : b.min.x, k & 2 ? b.max.y : b.min.y, k & 4 ? b.max.z : b.min.z);
    v.applyMatrix4(mesh.matrixWorld).project(camera);
    const x = (v.x * 0.5 + 0.5) * W, y = (v.y * 0.5 + 0.5) * H;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  x0 = Math.max(0, Math.floor(x0 - pad)); y0 = Math.max(0, Math.floor(y0 - pad));
  x1 = Math.min(W, Math.ceil(x1 + pad)); y1 = Math.min(H, Math.ceil(y1 + pad));
  return [x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0)];
}
function viewDepth(v) { return -v.clone().applyMatrix4(camera.matrixWorldInverse).z; }

async function render() {
  const t0 = performance.now();
  bgMat.uniforms.uProjInv.value.copy(camera.projectionMatrixInverse);
  bgMat.uniforms.uCamWorld.value.copy(camera.matrixWorld);
  bgMat.uniforms.uCamPos.value.copy(camera.position);
  renderer.setRenderTarget(acc); renderer.setClearColor(0x000000, 1); renderer.clear();
  runPass(bgMat, acc);

  // focus distance = depth of the focus pane's center
  const focusZ = viewDepth(panes[Math.round(P.focusPane)].pos) + (Q.has('focusOff') ? parseFloat(Q.get('focusOff')) : 0);
  const order = panes.slice().sort((a, b) => viewDepth(b.pos) - viewDepth(a.pos));

  // beam
  const bdir = BEAM_B.clone().sub(BEAM_A).normalize();

  // beam crossing parameter for every pane plane
  for (const p of panes) {
    const inv = p.mesh.matrixWorld.clone().invert();
    const a = BEAM_A.clone().applyMatrix4(inv), bb = BEAM_B.clone().applyMatrix4(inv);
    p.tBeam = a.z / (a.z - bb.z);
  }
  let tPrev = 0;
  tailT = Math.max(...panes.map((p) => p.tBeam));
  for (const p of order) {
    drawBeam(tPrev, Math.min(Math.max(p.tBeam, tPrev), 1), focusZ); tPrev = Math.min(Math.max(p.tBeam, tPrev), 1);
    // light attenuation by panes between light and this pane
    let between = 0;
    for (const q of panes) {
      if (q === p) continue;
      const inv = q.mesh.matrixWorld.clone().invert();
      const a = LIGHT.clone().applyMatrix4(inv), b = p.pos.clone().applyMatrix4(inv);
      if (a.z * b.z >= 0) continue;
      const h = a.clone().lerp(b, a.z / (a.z - b.z));
      if (Math.abs(h.x) < PANE.w / 2 + 0.3 && Math.abs(h.y) < PANE.h / 2 + 0.3) between++;
    }
    const atten = Math.pow(0.62, between);

    buildPyramid(accPyr);

    // pane uniforms
    const m = p.mesh; paneMeshes.forEach((x) => (x.visible = x === m));
    paneMat.uniforms.uRot.value.setFromMatrix4(m.matrixWorld);
    paneMat.uniforms.uFrostLvl.value = Math.log2(Math.max(P.frost * H, 1.0)) - 0.2;
    paneMat.uniforms.uAtten.value = atten;
    paneMat.uniforms.uEdge.value = P.edge * (0.35 + 0.65 * atten);
    // beam intersection in pane-local coords
    const inv = m.matrixWorld.clone().invert();
    const a = BEAM_A.clone().applyMatrix4(inv), bb = BEAM_B.clone().applyMatrix4(inv);
    const tt = a.z / (a.z - bb.z);
    const hit = a.clone().lerp(bb, tt);
    paneMat.uniforms.uSpot.value.copy(hit);
    paneMat.uniforms.uSpotI.value = P.spot * Math.pow(0.78, between) * 1.0;
    paneMat.uniforms.uIndex.value = p.i;

    renderer.setRenderTarget(layer); renderer.setClearColor(0x000000, 0); renderer.clear(true, true, false);
    renderer.render(paneScene, camera);
    buildPyramid(layPyr);

    // DOF composite over acc (scissored to the pane's screen box)
    const z = viewDepth(p.pos);
    const maxCoc = P.cocK * Math.abs(1 - focusZ / Math.max(z - 1.5, 0.2)) * H;
    const box = screenBox(m, maxCoc + 4);
    dofMat.uniforms.uProjInv.value.copy(camera.projectionMatrixInverse);
    dofMat.uniforms.uPlane.value.copy(planeInView(m));
    dofMat.uniforms.uFocus.value = focusZ;
    dofMat.uniforms.uCocK.value = DBG === 'noDof' ? 0 : P.cocK;
    acc.scissor.set(box[0], box[1], box[2], box[3]); acc.scissorTest = true;
    runPass(dofMat, acc);
    acc.scissorTest = false;
  }
  drawBeam(tPrev, 1, focusZ);
  buildPyramid(accPyr);
  runPass(finalMat, null);
  const gl = renderer.getContext(); gl.finish();
  console.log('render ms', Math.round(performance.now() - t0));
  window.__done = true;
}
render().catch((e) => { console.error(e.stack || e); window.__err = String(e); window.__done = true; });
</script>
</body>
</html>
